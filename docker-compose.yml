services:
  cardex-frontend:
    build:
      context: .
      dockerfile: CarDexFrontend/Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5001
    container_name: cardex-frontend
    ports:
      - "3000:8080"
    depends_on:
      - cardex-api
    networks:
      - cardex-network
    restart: always

  cardex-api:
    build:
      context: .
      dockerfile: CarDexBackend/CarDexBackend.Api/Dockerfile
    container_name: cardex-api
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__CarDexDatabase=${SUPABASE_CONNECTION_STRING}
      - Jwt__SecretKey=DevelopmentSecretKeyThatIsAtLeast32CharactersLong!123
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - cardex-network
    restart: always

networks:
  cardex-network:
    driver: bridge
